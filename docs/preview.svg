<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Cyber green theme preview">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63e6a4" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#63e6a4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#63e6a4" opacity="0.10"/>
      <rect y="1" width="4" height="2" fill="transparent"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="640" height="300" rx="14" fill="#0b100e"/>
  <rect width="640" height="300" rx="14" fill="url(#glow)"/>

  <!-- sidebar -->
  <rect x="16" y="16" width="132" height="268" rx="10" fill="#080d0b"/>
  <circle cx="40" cy="42" r="9" fill="#63e6a4" opacity="0.85"/>
  <rect x="56" y="36" width="58" height="9" rx="4.5" fill="#63e6a4" opacity="0.8"/>
  <g fill="#4bbf8b" opacity="0.75">
    <rect x="33" y="72" width="12" height="12" rx="3"/>
    <rect x="56" y="74" width="54" height="8" rx="4"/>
    <rect x="33" y="104" width="12" height="12" rx="3"/>
    <rect x="56" y="106" width="42" height="8" rx="4"/>
    <rect x="33" y="136" width="12" height="12" rx="3"/>
    <rect x="56" y="138" width="60" height="8" rx="4"/>
    <rect x="33" y="168" width="12" height="12" rx="3"/>
    <rect x="56" y="170" width="48" height="8" rx="4"/>
  </g>
  <rect x="24" y="196" width="116" height="22" rx="6" fill="#63e6a4" opacity="0.12"/>
  <rect x="32" y="203" width="64" height="8" rx="4" fill="#63e6a4" opacity="0.85"/>

  <!-- top bar -->
  <rect x="160" y="16" width="464" height="36" rx="10" fill="#0b100e"/>
  <rect x="176" y="28" width="96" height="12" rx="6" fill="#63e6a4" opacity="0.85"/>
  <g fill="#4bbf8b" opacity="0.7">
    <rect x="530" y="28" width="12" height="12" rx="3"/>
    <rect x="552" y="28" width="12" height="12" rx="3"/>
    <rect x="574" y="28" width="12" height="12" rx="3"/>
  </g>

  <!-- conversation -->
  <g fill="#63e6a4">
    <rect x="182" y="74" width="240" height="9" rx="4.5" opacity="0.85"/>
    <rect x="182" y="94" width="360" height="9" rx="4.5" opacity="0.6"/>
    <rect x="182" y="114" width="300" height="9" rx="4.5" opacity="0.6"/>
    <rect x="182" y="140" width="150" height="9" rx="4.5" opacity="0.85"/>
  </g>
  <rect x="182" y="162" width="404" height="60" rx="8" fill="#0a1410" stroke="#63e6a4" stroke-opacity="0.25"/>
  <g fill="#4bbf8b" opacity="0.55">
    <rect x="196" y="176" width="150" height="7" rx="3.5"/>
    <rect x="210" y="191" width="220" height="7" rx="3.5"/>
    <rect x="196" y="206" width="110" height="7" rx="3.5"/>
  </g>

  <!-- composer -->
  <rect x="182" y="238" width="404" height="46" rx="10" fill="#101713" stroke="#63e6a4" stroke-opacity="0.28"/>
  <rect x="196" y="254" width="150" height="9" rx="4.5" fill="#63e6a4" opacity="0.45"/>
  <circle cx="566" cy="261" r="9" fill="none" stroke="#63e6a4" stroke-width="2"/>

  <!-- toggle pill -->
  <rect x="300" y="292" width="112" height="0" fill="none"/>
  <rect x="286" y="286" width="96" height="16" rx="8" fill="#63e6a4" opacity="0.14" stroke="#63e6a4" stroke-opacity="0.4"/>
  <circle cx="298" cy="294" r="3.5" fill="#63e6a4"/>

  <!-- CRT -->
  <rect width="640" height="300" fill="url(#vignette)"/>
  <rect width="640" height="300" fill="url(#scan)"/>
</svg>
